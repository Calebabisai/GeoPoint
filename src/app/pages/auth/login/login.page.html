<ion-content class="login-page">
  <div class="login-container">
    <div class="brand-section animate-fadeIn">
      <div class="brand-logo">
        <ion-icon name="location" class="logo-icon"></ion-icon>
      </div>
      <h1 class="brand-title">GeoPoint</h1>
      <p class="brand-subtitle">Mapeo inteligente para tu negocio</p>
    </div>

    <form (ngSubmit)="login()" class="login-form animate-slideInUp">
      <div class="form-group">
        <label class="form-label">Correo electrónico</label>
        <ion-input
          [value]="email()"
          (ionInput)="updateEmail($any($event.target).value)"
          name="email"
          type="email"
          placeholder="tu@email.com"
          fill="outline"
          class="uber-input"
          [disabled]="loading()"
          required
        ></ion-input>
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <ion-input
          [value]="password()"
          (ionInput)="updatePassword($any($event.target).value)"
          name="password"
          type="password"
          placeholder="••••••••"
          fill="outline"
          class="uber-input"
          [disabled]="loading()"
          required
        ></ion-input>
      </div>

      <div class="form-actions">
        <ion-button
          expand="block"
          size="large"
          type="submit"
          class="login-button"
          [disabled]="!canSubmit()"
        >
          @if (loading()) {
            <ion-spinner name="crescent"></ion-spinner>
            <span>Iniciando sesión...</span>
          } @else {
            <ion-icon name="log-in-outline" slot="start"></ion-icon>
            <span>Iniciar Sesión</span>
          }
        </ion-button>

        <div class="divider">
          <span class="divider-text">o</span>
        </div>

        <ion-button
          expand="block"
          fill="outline"
          size="large"
          routerLink="/register"
          class="register-button"
          [disabled]="loading()"
        >
          <ion-icon name="person-add-outline" slot="start"></ion-icon>
          <span>Crear nueva cuenta</span>
        </ion-button>
      </div>
    </form>

    <div class="login-footer">
      <p class="footer-text">
        Al continuar, aceptas nuestros
        <a href="#" class="footer-link">Términos de Servicio</a>
        y
        <a href="#" class="footer-link">Política de Privacidad</a>
      </p>
    </div>
  </div>
</ion-content>
