<!-- Indicador de carga de ubicación -->
@if (isLoadingLocation()) {
  <div class="loading-location">
    <ion-spinner name="crescent"></ion-spinner>
  </div>
}

<!-- Indicador de precarga de tiles -->
@if (isCaching()) {
  <div class="caching-indicator">
    <ion-chip color="primary">
      <ion-icon name="download-outline"></ion-icon>
      <ion-label>
        Descargando mapa: {{ cacheStats().cachedTiles }}/{{ cacheStats().totalTiles }}
      </ion-label>
    </ion-chip>
  </div>
}

<!-- Mapa -->
<div id="map-container"></div>
<!-- Controles del mapa -->
<app-map-controls></app-map-controls>

<!-- NUEVO: Control de ubicación en tiempo real -->
<div class="user-location-control-container">
  <app-user-location-control></app-user-location-control>
</div>
